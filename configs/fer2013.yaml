# FER2013, source: FER_FER2013.ipynb
# Every value below is copied from the official notebook unless marked otherwise.

dataset: fer2013
kaggle_slug: msambare/fer2013

paths:
  raw_dir: data/fer2013/raw
  train_dir: data/fer2013/raw/train   # the dataset's own split is used
  test_dir: data/fer2013/raw/test

image:
  size: [48, 48]
  color_mode: grayscale

# Class order = alphabetical folder order (what flow_from_directory uses).
# NOTE: the notebook's label_map lists Angry, Disgust, Fear, Happy, Sad,
# Surprise, Neutral, which does NOT match this order, so its plots mislabel
# neutral/sad/surprise. We use the real folder order. See README.
classes:
  angry: Angry
  disgust: Disgust
  fear: Fear
  happy: Happy
  neutral: Neutral
  sad: Sad
  surprise: Surprise

model:
  conv_type: separable          # SeparableConv2D for FER2013
  filters: [64, 128, 256, 512]
  kernel_size: 3
  kernel_initializer: he_normal # used for both depthwise and pointwise kernels
  block_dropout: 0.25
  dense_units: 512
  dense_dropout: 0.5

training:
  seed: 42                      # not in the original
  batch_size: 32
  epochs: 100
  loss: categorical_crossentropy
  optimizer: adam
  learning_rate: 0.001          # ExponentialDecay is defined but unused (see ck.yaml)
  validation_split: 0.1

augmentation:
  rescale: 0.00392156862745098  # 1/255
  rotation_range: 15
  width_shift_range: 0.15
  height_shift_range: 0.15
  shear_range: 0.15
  zoom_range: 0.15
  horizontal_flip: true

callbacks:
  early_stopping:
    monitor: val_loss
    patience: 25
    restore_best_weights: true
  reduce_lr:
    monitor: val_loss
    factor: 0.001
    patience: 10
    min_delta: 0.0001

paper:
  test_accuracy: 0.64
  total_params: 2907984
