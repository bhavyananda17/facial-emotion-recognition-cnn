# RAF-DB (Real-world Affective Faces, basic emotions), source: FER_RAFDB.ipynb
# Every value below is copied from the official notebook unless marked otherwise.

dataset: rafdb
kaggle_slug: shuvoalok/raf-db-dataset

paths:
  raw_dir: data/rafdb/raw
  train_dir: data/rafdb/raw/DATASET/train   # the dataset's own split is used
  test_dir: data/rafdb/raw/DATASET/test

image:
  size: [100, 100]
  color_mode: grayscale         # the paper says colour; the code loads grayscale

# Folders are named 1..7. Sorted order is 1..7, so index 0 = folder "1".
# Names follow the official RAF-DB coding (1 Surprise ... 7 Neutral).
# NOTE: the notebook maps index 0..6 to Angry, Disgust, Fear, Happy, Sad,
# Surprise, Neutral, which is wrong for 5 of 7 classes. See README.
classes:
  "1": Surprise
  "2": Fear
  "3": Disgust
  "4": Happy
  "5": Sad
  "6": Angry
  "7": Neutral

model:
  conv_type: separable          # SeparableConv2D for RAF-DB
  filters: [64, 128, 256, 512]
  kernel_size: 3
  kernel_initializer: he_normal
  block_dropout: 0.25
  dense_units: 512
  dense_dropout: 0.5

training:
  seed: 42                      # not in the original
  batch_size: 32
  epochs: 100
  loss: categorical_crossentropy
  optimizer: adam
  learning_rate: 0.001          # ExponentialDecay is defined but unused (see ck.yaml)
  validation_split: 0.1

augmentation:
  rescale: 0.00392156862745098  # 1/255
  rotation_range: 15
  width_shift_range: 0.15
  height_shift_range: 0.15
  shear_range: 0.15
  zoom_range: 0.15
  horizontal_flip: true

callbacks:
  early_stopping:
    monitor: val_loss
    patience: 25
    restore_best_weights: true
  reduce_lr:
    monitor: val_loss
    factor: 0.001
    patience: 10
    min_delta: 0.0001

paper:
  test_accuracy: 0.83
  total_params: 9985872
